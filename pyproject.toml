[project]
name = "mid-thesis-pipeline"
version = "0.1.0"
description = "Analytical pipeline for the MiD-based master's thesis"
requires-python = "==3.12.*"
dependencies = [
    "matplotlib==3.11.0",
    "numpy==2.4.6",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "scipy==1.18.0",
    "statsmodels==0.14.6",
]

[dependency-groups]
notebooks = [
    "ipykernel==7.3.0",
    "ipython==9.14.1",
]

[tool.uv]
package = false
